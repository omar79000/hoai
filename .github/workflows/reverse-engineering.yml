name: Reverse Engineering - Static Audit

on:
  push:
    branches:
      - reverse-engineering/initial-audit
    paths:
      - "*.rar"
      - ".github/workflows/reverse-engineering.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reverse-engineering-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Extract and inspect application packages safely
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout uploaded archives
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up .NET SDK for managed assembly analysis
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install inspection utilities
        timeout-minutes: 18
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 600s sudo apt-get update -o Acquire::Retries=3
          timeout 900s sudo apt-get install -y --no-install-recommends file binutils p7zip-full mdbtools mono-utils poppler-utils python3 ripgrep unzip zip coreutils

      - name: Inventory and extract archives without executing applications
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/input audit/extracted audit/reports
          find . -maxdepth 1 -type f -iname '*.rar' -print0 | while IFS= read -r -d '' f; do cp -- "$f" audit/input/; done
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path("audit")
          items = []
          archives = sorted((root/"input").iterdir())
          if not archives:
              raise SystemExit("No RAR archives found at repository root.")
          for archive in archives:
              if not archive.is_file():
                  continue
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              out = root/"extracted"/archive.stem
              out.mkdir(parents=True, exist_ok=True)
              listing = subprocess.run(["7z","l","-slt",str(archive)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (root/"reports"/(archive.name+".listing.txt")).write_text(listing.stdout,encoding="utf-8",errors="replace")
              extract = subprocess.run(["7z","x","-y",f"-o{out}",str(archive)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (root/"reports"/(archive.name+".extract.log")).write_text(extract.stdout,encoding="utf-8",errors="replace")
              items.append({"archive":archive.name,"bytes":archive.stat().st_size,"sha256":digest,"listing_exit":listing.returncode,"extract_method":"7z","extract_exit":extract.returncode,"extracted_to":str(out)})
              if listing.returncode != 0 or extract.returncode != 0:
                  raise SystemExit(f"Archive processing failed: {archive.name}")
          (root/"reports"/"archives.json").write_text(json.dumps(items,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(items,indent=2,ensure_ascii=False))
          PY

      - name: Inspect extracted files and identify application technologies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess
          base=pathlib.Path("audit/extracted")
          report=pathlib.Path("audit/reports")
          extensions={}
          files=[]
          patterns={
            "RouterOS and MikroTik API":r"(?i)(/ip\s+(hotspot|pool|address|dhcp|firewall)|/user\s+(add|set|remove|print)|/tool\s+user-manager|/queue\s+(simple|tree)|/system\s+(identity|resource)|\.api|8728|8729|routeros|mikrotik)",
            "Database and SQL":r"(?i)(sqlite|mysql|mariadb|sqlserver|oledb|\.mdb|\.accdb|create\s+table|select\s+.+\s+from)",
            "Printing and card generation":r"(?i)(zebra|escpos|crystal.?reports|reportviewer|printdocument|printer|barcode|qrcode|pdf|ticket|card)",
            "Sales and reporting":r"(?i)(sales|revenue|profit|invoice|receipt|report|export|excel|xlsx|csv|بيع|مبيعات|تقرير|ارباح|فاتورة)",
            "Credentials and networking":r"(?i)(password|passwd|username|credential|login|socket|tcpclient|webrequest|httpclient|ssh|winbox)"
          }
          hits={k:[] for k in patterns}
          for p in sorted(base.rglob("*")):
            if not p.is_file(): continue
            rel=str(p.relative_to(base))
            ext=p.suffix.lower() or "[no extension]"
            extensions[ext]=extensions.get(ext,0)+1
            data=p.read_bytes()
            row={"path":rel,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
            row["file_type"]=subprocess.run(["file","-b",str(p)],text=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL).stdout.strip()
            files.append(row)
            textual=ext in {".xml",".json",".config",".ini",".txt",".cs",".vb",".py",".js",".html",".sql",".java",".kt",".properties",".yaml",".yml",".md",".php",".bat",".ps1"}
            if len(data)<=2_000_000 and (textual or b"\0" not in data[:8192]):
              text=data.decode("utf-8",errors="ignore")
              for label,pat in patterns.items():
                for m in list(re.finditer(pat,text))[:30]:
                  snippet=text[max(0,m.start()-100):min(len(text),m.end()+180)].replace("\r"," ").replace("\n"," ")
                  hits[label].append({"file":rel,"match":m.group(0)[:100],"context":snippet[:400]})
          (report/"file_inventory.json").write_text(json.dumps(files,indent=2,ensure_ascii=False),encoding="utf-8")
          (report/"extension_counts.json").write_text(json.dumps(extensions,indent=2,ensure_ascii=False),encoding="utf-8")
          (report/"pattern_hits.json").write_text(json.dumps(hits,indent=2,ensure_ascii=False),encoding="utf-8")
          md=["# Static reverse-engineering audit","",
              "> Static inspection only. No application executable, installer, script, or macro was launched.","",
              "## Archive extraction",""]
          for a in json.loads((report/"archives.json").read_text()):
            md += [f"- **{a['archive']}** — {a['bytes']:,} bytes; SHA-256 {a['sha256']}; extraction via {a['extract_method']} (exit {a['extract_exit']})."]
          md += ["","## File inventory summary","",f"- Total extracted files: **{len(files)}**",""]
          md += [f"- {k}: {v}" for k,v in sorted(extensions.items(),key=lambda x:(-x[1],x[0]))]
          md += ["","## Technology and function indicators",""]
          for label,entries in hits.items():
            md += [f"### {label} ({len(entries)} matches)",""]
            for h in entries[:100]:
              md += [f"- {h['file']} — {h['match']}: {h['context']}"]
            if not entries: md += ["- No matching text indicators found."]
            md += [""]
          md += ["## Important limitations","",
            "- This report is evidence from filenames, file signatures, and readable strings; it is not proof of runtime behavior.",
            "- Packed, encrypted, password-protected, or unsupported archives may not have extracted completely. Check each extract log and archive listing.",
            "- Compiled applications may require format-specific decompilers and manual review. Original source code cannot be guaranteed to be recoverable.",
            "- RouterOS commands discovered in strings or source are candidates; call sites, arguments, sequencing, and error handling must be traced before changing anything.",
            "- Do not connect this analysis to a production MikroTik router or run extracted programs as part of static inspection."]
          (report/"STATIC_AUDIT.md").write_text("\n".join(md)+"\n",encoding="utf-8")
          print(f"Inspected {len(files)} files; extensions: {extensions}")
          PY
          find audit/extracted -type f -print0 | xargs -0 -r file > audit/reports/file-signatures.txt

      - name: Decompile managed assemblies and inspect Access schemas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/decompiled audit/reports/database audit/reports/strings
          TOOL_DIR="$HOME/.dotnet/tools"
          if dotnet tool install ilspycmd --tool-path "$TOOL_DIR" >audit/reports/ilspy-install.log 2>&1; then
            ILSPY="$TOOL_DIR/ilspycmd"
            while IFS= read -r -d '' assembly; do
              rel="${assembly#audit/extracted/}"
              safe="$(printf '%s' "$rel" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')"
              echo "Inspecting managed assembly: $rel"
              mkdir -p "audit/decompiled/$safe"
              if timeout 120s "$ILSPY" -p -o "audit/decompiled/$safe" "$assembly" >"audit/reports/strings/$safe.ilspy.log" 2>&1; then
                echo "Project decompilation succeeded: $rel" >>audit/reports/DECOMPILATION_NOTES.md
              else
                rc=$?
                echo "Project decompilation failed (exit $rc) for $rel; no protection bypass attempted." >>audit/reports/DECOMPILATION_NOTES.md
                timeout 60s "$ILSPY" "$assembly" >"audit/reports/strings/$safe.decompile.txt" 2>>"audit/reports/strings/$safe.ilspy.log" || true
              fi
              strings -a -n 4 "$assembly" >"audit/reports/strings/$safe.ascii.txt" 2>/dev/null || true
              strings -el -n 4 "$assembly" >"audit/reports/strings/$safe.utf16.txt" 2>/dev/null || true
            done < <(find audit/extracted -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          else
            echo "ILSpy installation failed; see ilspy-install.log." >>audit/reports/DECOMPILATION_NOTES.md
          fi
          if command -v mdb-tables >/dev/null 2>&1; then
            while IFS= read -r -d '' db; do
              rel="${db#audit/extracted/}"
              safe="$(printf '%s' "$rel" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')"
              mdb-tables -1 "$db" >"audit/reports/database/$safe.tables.txt" 2>"audit/reports/database/$safe.tables.err" || true
              mdb-schema "$db" access >"audit/reports/database/$safe.schema.sql" 2>"audit/reports/database/$safe.schema.err" || true
            done < <(find audit/extracted -type f \( -iname '*.mdb' -o -iname '*.accdb' \) -print0)
          else
            echo "mdbtools unavailable; Access schemas were not extracted." >>audit/reports/DECOMPILATION_NOTES.md
          fi
          echo "Managed assembly and Access database inspection step finished; review per-file logs."

      - name: Extract searchable text from bundled PDF manuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/reports/manuals
          while IFS= read -r -d '' pdf; do
            rel="${pdf#audit/extracted/}"
            safe="$(printf '%s' "$rel" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')"
            if pdftotext -layout "$pdf" "audit/reports/manuals/$safe.txt" 2>"audit/reports/manuals/$safe.err"; then
              echo "Extracted PDF text: $rel"
            else
              echo "PDF text extraction failed: $rel" >>audit/reports/manuals/STATUS.txt
            fi
          done < <(find audit/extracted -type f -iname '*.pdf' -print0)
          if ! find audit/reports/manuals -type f -name '*.txt' -print -quit | grep -q .; then
            echo "No searchable PDF text was extracted." >audit/reports/manuals/STATUS.txt
          fi

      - name: Extract managed assembly metadata without bypassing protections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/reports/metadata
          if ! command -v monodis >/dev/null 2>&1; then
            echo "monodis is unavailable; metadata-only inspection was skipped." >audit/reports/metadata/STATUS.txt
          else
            while IFS= read -r -d '' assembly; do
              rel="${assembly#audit/extracted/}"
              safe="$(printf '%s' "$rel" | tr '/ ' '__' | tr -cd '[:alnum:]_.-')"
              for mode in assembly typedef method fields property manifest; do
                if timeout 60s monodis "--$mode" "$assembly" >"audit/reports/metadata/$safe.$mode.txt" 2>&1; then
                  :
                else
                  rc=$?
                  echo "monodis --$mode failed or timed out (exit $rc) for $rel" >>audit/reports/metadata/STATUS.txt
                fi
              done
            done < <(find audit/extracted -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          fi

      - name: Probe .NET metadata and method IL with dnfile and dncil
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input dnfile dncil
          mkdir -p audit/reports/dotnet_probe
          mapfile -d '' assemblies < <(find audit/extracted -type f -iname '*.exe' -print0)
          if (("${#assemblies[@]}" == 0)); then
            echo "No application EXE files found." > audit/reports/dotnet_probe/STATUS.md
          else
            .venv/bin/python tools/dotnet_static_probe.py --out audit/reports/dotnet_probe "${assemblies[@]}"
          fi

      - name: Summarize executable indicators and metadata failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          root=pathlib.Path("audit/reports")
          strings=root/"strings"
          out=root/"APPLICATION_INDICATORS.md"
          patterns=[
            ("RouterOS / MikroTik",r"(?i)routeros|mikrotik|user.?manager|hotspot|radius|winbox|/ip(?:/|\s)|/tool(?:/|\s)|8728|8729"),
            ("Network / transport",r"(?i)TcpClient|TcpListener|NetworkStream|Socket|WebRequest|HttpWebRequest|HttpWebResponse|HttpClient|WebClient|SslStream|ConnectAsync|GetResponse|SendAsync|Receive"),
            ("Authentication / settings",r"(?i)username|password|passwd|credential|authentication|login|server.?address|ip.?address|port"),
            ("Sales / cards / sessions",r"(?i)Selling.?points|tableSales|tableSessions|columnuser|columnprice|expiration_date|first_login|total_download|total_time|profile|session|voucher|ticket|card")
          ]
          files=sorted(p for p in strings.iterdir() if p.is_file() and p.name.lower().endswith((".exe.ascii.txt",".exe.utf16.txt")) )
          lines=["# Executable string indicators (static evidence only)","",
                 "These are readable strings extracted from the two EXE files. A string alone does not prove that code executes it or that it is a RouterOS command.",
                 "No credentials, raw databases, executable files, or DLL binaries are included here.",""]
          for label,pat in patterns:
            lines += [f"## {label}",""]
            found=[]
            for p in files:
              try: content=p.read_text(encoding="utf-8",errors="replace")
              except Exception: continue
              for raw in content.splitlines():
                s=raw.strip()
                if len(s)<3 or len(s)>500 or not re.search(pat,s): continue
                if re.search(r"(?i)(password|passwd|token|secret|api.?key)\s*[:=]",s):
                  s=re.sub(r"(?i)((?:password|passwd|token|secret|api.?key)\s*[:=]\s*)\S+",r"\1[REDACTED]",s)
                s=re.sub(r"\b\d{6,}:[A-Za-z0-9_-]{25,}\b","[REDACTED_BOT_TOKEN]",s)
                if re.search(r"(?i)https?://[^/@: ]+:[^/@ ]+@",s):
                  s=re.sub(r"(https?://)[^/@: ]+:[^/@ ]+@",r"\1[REDACTED]@",s)
                found.append(f"- `{p.name}`: `{s[:300]}`")
            lines += (found[:120] if found else ["- No readable matches found."]) + [""]
          status=root/"metadata"/"STATUS.txt"
          lines += ["## Metadata extraction status",""]
          if status.exists():
            lines += ["```text",status.read_text(encoding="utf-8",errors="replace")[:12000],"```",""]
          else:
            lines += ["- No metadata status file was produced.",""]
          out.write_text("\n".join(lines),encoding="utf-8")
          print(f"Wrote {out}")
          PY

      - name: Build sanitized analysis artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, shutil
          src=pathlib.Path("audit")
          dst=src/"public-artifact"
          dst.mkdir(parents=True,exist_ok=True)
          selected=["reports/STATIC_AUDIT.md","reports/archives.json","reports/file_inventory.json",
                    "reports/extension_counts.json","reports/pattern_hits.json","reports/DECOMPILATION_NOTES.md","reports/APPLICATION_INDICATORS.md","reports/metadata/STATUS.txt","reports/manuals/STATUS.txt"]
          secret_patterns=[
            re.compile(r'(?i)(password|passwd|token|secret|api[_-]?key)(\s*[:=]\s*)(["\x27])([^"\x27\r\n]+)(["\x27])'),
            re.compile(r'(?i)(https?://)([^/@:\s]+):([^/@\s]+)@'),
            re.compile(r'\b\d{6,}:[A-Za-z0-9_-]{25,}\b')
          ]
          def scrub(s):
            s=secret_patterns[0].sub(lambda m:m.group(1)+m.group(2)+m.group(3)+"[REDACTED]"+m.group(5),s)
            s=secret_patterns[1].sub(r'\1[REDACTED]@',s)
            return secret_patterns[2].sub("[REDACTED_BOT_TOKEN]",s)
          for rel in selected:
            p=src/rel
            if p.exists():
              out=dst/pathlib.Path(rel).name
              out.write_text(scrub(p.read_text(encoding="utf-8",errors="replace")),encoding="utf-8")
          for folder in ["reports/database","reports/metadata","reports/dotnet_probe","reports/manuals","decompiled"]:
            base=src/folder
            if not base.exists(): continue
            for p in base.rglob("*"):
              if not p.is_file(): continue
              if p.suffix.lower() not in {".sql",".txt",".cs",".vb",".json",".md",".log"}: continue
              try:
                text=p.read_text(encoding="utf-8",errors="replace")
              except Exception:
                continue
              rel=p.relative_to(src)
              out=dst/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_text(scrub(text),encoding="utf-8")
          (dst/"ARTIFACT_SCOPE.txt").write_text(
            "Sanitized static-analysis outputs only. Original archives, executable files, DLLs, Access database contents, PDFs, images, and raw binary strings are intentionally excluded.\n"
            "No executable was run and no production MikroTik router was contacted.\n",encoding="utf-8")
          PY

      - name: Publish sanitized audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: hoai-static-reverse-engineering-audit
          path: audit/public-artifact/
          if-no-files-found: error
          retention-days: 30
